<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="mavtrails">MavTrails</ion-title>
  </ion-toolbar>
  <ion-button slot="end" (click)="navigatePage('profile')">Profile</ion-button>
</ion-header>


<!-- For ratings make sure to average all ratings and have final answer be output -->

<ion-content>
  <ion-grid>
    <ion-col size="6">
      <ion-col></ion-col>
      <div>
        Posted by: {{postedBy.username}}
        <div class="circle-picture">
          <img src="https://shopfivenine.com/cdn/shop/files/IMG_08582.jpg?v=1692306741&width=2588" />
        </div>
        <br>
        Rating: {{trail.ratings}}
      </div>
    </ion-col>

    <ion-grid>
      <ion-col size="6" class="details">
        <ion-col class="ion text ion-text-center"></ion-col>
        <ion-col></ion-col>
        <div> Details </div>
      </ion-col>
    </ion-grid>

    <ion-row>
      <ion-toolbar>
        <ion-title size="large">Difficulty</ion-title>
        {{trail.difficulty}}
      </ion-toolbar>

      <ion-toolbar>
        <ion-title size="large">Features</ion-title>
        {{trail.features}}
      </ion-toolbar>

      <ion-toolbar>
        <ion-title size="large">Features</ion-title>
        {{trail.features}}
      </ion-toolbar>

      <ion-toolbar>
        <ion-title size="large">Media</ion-title>

        <ion-card>
          <ion-card-title>
            Music
          </ion-card-title>
          <ion-card-content>
            <ion-row>
              Music 1
            </ion-row>
          </ion-card-content>
        </ion-card>

        <ion-card>
          <ion-card-title>
            Podcasts
          </ion-card-title>
          <ion-card-content>
            <ion-row>
              Podcast 1
            </ion-row>
          </ion-card-content>
        </ion-card>

        <ion-card>
          <ion-card-title>
            Audiobook
          </ion-card-title>
          <ion-card-content>
            <ion-row>
              Audiobook 1
            </ion-row>
          </ion-card-content>
        </ion-card>

      </ion-toolbar>
    </ion-row>

  </ion-grid>

  <ion-button (click)="openMediaModal()">
    Add Media
  </ion-button>

  <ion-button (click)="openRatingModal()">Rate Trail</ion-button>
  <ion-button (click)="navigatePage('home')">Home</ion-button>

  <swiper-container>
    <swiper-slide>Slide 1</swiper-slide>
    <swiper-slide>Slide 2</swiper-slide>
    <swiper-slide>Slide 3</swiper-slide>
  </swiper-container>

</ion-content>
