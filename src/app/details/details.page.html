<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Details</ion-title>
  </ion-toolbar>
  <ion-button slot="end" (click)="navigatePage('profile')">Profile</ion-button>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-content>
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <div>
            Posted by: {{postedBy.username}}
            <div class="circle-picture">
              <img src="https://shopfivenine.com/cdn/shop/files/IMG_08582.jpg?v=1692306741&width=2588" />
            </div>
            <br>
            Rating: {{detailsOne.ratings}}
          </div>
        </ion-col>

        <ion-col size="6" class="mavtrails">
          <div>MAVTRAILS</div>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-toolbar>
          <ion-title size="large">Difficulty</ion-title>
          {{detailsOne.difficulty}}
        </ion-toolbar>

        <ion-toolbar>
          <ion-title size="large">Features</ion-title>
          {{detailsOne.features}}
        </ion-toolbar>

        <ion-toolbar>
          <ion-title size="large">Media</ion-title>
          It's own thing
        </ion-toolbar>
      </ion-row>

    </ion-grid>

    <ion-button (click)="navigatePage('home')">Home</ion-button>
  </ion-content>
