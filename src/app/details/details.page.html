<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="mavtrails">MavTrails</ion-title>
  </ion-toolbar>
  <ion-button slot="end" (click)="navigatePage('profile')">Profile</ion-button>
</ion-header>


<!-- For ratings make sure to average all ratings and have final answer be output -->

<ion-content>


  <div class="details"> Details </div>

  <ion-grid>
    <ion-col size="6">
      <ion-col></ion-col>
      <div>
        Posted by: {{postedBy.username}}
        <div class="circle-picture">
          <img src="https://shopfivenine.com/cdn/shop/files/IMG_08582.jpg?v=1692306741&width=2588" />
        </div>
        <br>
        Rating: {{trail.ratings}}
      </div>
    </ion-col>



    <ion-row>
      <ion-col>
        <ion-title size="large">Difficulty</ion-title>
        {{trail.difficulty}}
      </ion-col>

      <ion-col>
        <ion-title size="large">Features</ion-title>
        {{trail.features}}
      </ion-col>

      <ion-col>
      <ion-toolbar>
        <ion-title size="large">Media</ion-title>
      </ion-col>
    </ion-row>

  </ion-grid>

  <ion-button (click)="openRatingModal()">Rate Trail</ion-button>
  <ion-button (click)="navigatePage('home')">Home</ion-button>
</ion-content>
