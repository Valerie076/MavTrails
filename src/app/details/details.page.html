<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-toolbar>
    <ion-title size="large">Difficulty</ion-title>
    <ion-card>
      {{trail.difficulty}}
    </ion-card>
  </ion-toolbar>

  <ion-toolbar>
    <ion-title size="large">Features</ion-title>
    <ion-card>
      {{trail.features}}
    </ion-card>
  </ion-toolbar>

  <ion-toolbar>
    <ion-title size="large">Media</ion-title>
    
    <ion-card>
      It's own thing
    </ion-card>
  </ion-toolbar>

  <ion-header>Posted by:</ion-header>
  {{postedBy.username}}
  <ion-header>Rating:</ion-header>
  {{trail.ratings}}
  <!-- For ratings make sure to average all ratings and have final answer be output -->
</ion-content>

<ion-button (click)="navigatePage('home')">Home</ion-button>
