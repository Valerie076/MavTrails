<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="mavtrails">
      MavTrails
    </ion-title>
    <ion-button slot="end" (click)="navigatePage('profile')">Profile</ion-button>
    <ion-button slot="end" (click)="logout()" color="danger">Logout</ion-button>
    <ion-button routerLink="/main-map">Main Map</ion-button>

  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>

      <ion-col size="auto">
        <ion-searchbar class="search" placeholder="Search" (ionInput)="handleInput($event)"></ion-searchbar>
      </ion-col>
      <ion-col>
        <ion-select placeholder="Selected Features" (ionChange)="onFeatureChange($event)"
          [multiple]="true">
          <ion-select-option value="hills">Hills</ion-select-option>
          <ion-select-option value="plains">Plains</ion-select-option>
          <ion-select-option value="wooded">Wooded</ion-select-option>
          <ion-select-option value="water">Water</ion-select-option>
          <ion-select-option value="houses">Houses</ion-select-option>
        </ion-select>
      </ion-col>
      <ion-col>
        <ion-select placeholder="Difficulty Choice"
          (ionChange)="onDifficultyChange($event)">
          <ion-select-option value="very easy">Very Easy</ion-select-option>
          <ion-select-option value="easy">Easy</ion-select-option>
          <ion-select-option value="medium">Medium</ion-select-option>
          <ion-select-option value="hard">Hard</ion-select-option>
        </ion-select>
      </ion-col>
      <ion-col>
        <ion-select placeholder="Choose Minimum Rating" (ionChange)="onRatingChange($event)">
          <ion-select-option value="5">5 Stars Only</ion-select-option>
          <ion-select-option value="4">4 Stars and Above</ion-select-option>
          <ion-select-option value="3">3 Stars and Above</ion-select-option>
          <ion-select-option value="2">2 Stars and Above</ion-select-option>
          <ion-select-option value="1">All Rated Trails</ion-select-option>
        </ion-select>
      </ion-col>
    </ion-row>
  </ion-grid>

  <br>

  <ion-card><strong>
      Trails - click one to view details!
    </strong></ion-card>

  @for(trail of results; track $index) {
  <ion-item style="text-align: center;">
    <ion-button (click)="openTrailDetails(trail)" expand="block">
      {{trail.name}}
    </ion-button>
  </ion-item>
  }

</ion-content>
