<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      poopybbutt
    </ion-title>
    <ion-button slot="end" (click)="navigatePage('profile')">Profile</ion-button>
    <ion-button slot="end" (click)="logout()" color="danger">Logout</ion-button>
    <ion-button routerLink="/main-map">Main Map</ion-button>

  </ion-toolbar>
</ion-header>

<ion-button (click)="navigatePage('details')">Details</ion-button>
<ion-button (click)="openTrailModal()">
  Add Trail
</ion-button>

<ion-searchbar placeholder="Search for a trail"></ion-searchbar>

<ion-content>

  <ion-accordion-group>
    <ion-accordion value="first">
      <ion-item slot="header" color="light">
        <ion-label>Features</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">Hills</div>
      <div class="ion-padding" slot="content">Plains</div>
      <div class="ion-padding" slot="content">Wooded</div>
      <div class="ion-padding" slot="content">Water</div>
      <div class="ion-padding" slot="content">Houses</div>
    </ion-accordion>
    <ion-accordion value="second">
      <ion-item slot="header" color="light">
        <ion-label>Difficulty</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">Difficult</div>
      <div class="ion-padding" slot="content">Hard</div>
      <div class="ion-padding" slot="content">Medium</div>
      <div class="ion-padding" slot="content">Easy</div>
      <div class="ion-padding" slot="content">Very Easy</div>
    </ion-accordion>
    <ion-accordion value="third">
      <ion-item slot="header" color="light">
        <ion-label>Rating</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">
        <ion-row>
          <ion-img class="star-one"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Yellow_Star_with_rounded_edges.svg/3840px-Yellow_Star_with_rounded_edges.svg.png">
          </ion-img><ion-img class="star-one"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Yellow_Star_with_rounded_edges.svg/3840px-Yellow_Star_with_rounded_edges.svg.png"></ion-img>
