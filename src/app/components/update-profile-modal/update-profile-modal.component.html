<ion-header>
  <ion-toolbar>
    <ion-title>
      Update Your Profile!
    </ion-title>

    <ion-button slot="end" (click)="closeModal()">
      Close
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
  <ion-input [(ngModel)]="updateEmailIn" label="Email:" placeholder="enter here"></ion-input>
  </ion-item>
  
  <ion-item>
  <ion-input [(ngModel)]="updatePhoneIn" label="Phone:" placeholder="enter here"></ion-input>
  </ion-item>

  <ion-item>
  <ion-input [(ngModel)]="updateUsernameIn" label="Username:" placeholder="enter here"></ion-input>
  </ion-item>

  <ion-item>
  <ion-input [(ngModel)]="updatePasswordIn" label="Password:" placeholder="enter here"></ion-input>
  </ion-item>

  <ion-item>
  <ion-input [(ngModel)]="updatePicIn" label="Profile Pic:" placeholder="enter here"></ion-input>
  </ion-item>
</ion-content>
