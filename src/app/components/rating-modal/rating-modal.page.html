<ion-header>
  <ion-toolbar>
    <ion-title>Rate Trail</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">
        Close
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label>Trail Rating</ion-label>

    <ion-select
      placeholder="Choose a rating" (ionChange)="onRatingChange($event)">

      <ion-select-option value="1">
        1 ⭐
      </ion-select-option>

      <ion-select-option value="2">
        2 ⭐⭐
      </ion-select-option>

      <ion-select-option value="3">
        3 ⭐⭐⭐
      </ion-select-option>

      <ion-select-option value="4">
        4 ⭐⭐⭐⭐
      </ion-select-option>

      <ion-select-option value="5">
        5 ⭐⭐⭐⭐⭐
      </ion-select-option>

    </ion-select>
  </ion-item>

  <ion-item>
    <ion-textarea
      label="Review (Optional)"
      placeholder="Write a short review">
    </ion-textarea>
  </ion-item>

  <ion-button (click)="closeRatings()" expand="block" >
    Submit Rating
  </ion-button>

</ion-content>
