<ion-header>
  <ion-toolbar>
    <ion-title>
      Add New Trail
    </ion-title>

    <ion-button slot="end" (click)="closeModal()">
      Close
    </ion-button>

  </ion-toolbar>
</ion-header>


<ion-content>

  <ion-item>
    <ion-input 
      label="Trail Name"
      placeholder="Enter trail name"
      [(ngModel)]="name">
    </ion-input>
  </ion-item>


  <ion-item>
    <ion-input 
      label="Location"
      placeholder="Enter location"
      [(ngModel)]="location">
    </ion-input>
  </ion-item>


  <ion-item>
    <ion-textarea
      label="Description"
      placeholder="Describe the trail"
      [(ngModel)]="description">
    </ion-textarea>
  </ion-item>


  <ion-button expand="block" (click)="saveTrail()">
    Save Trail
  </ion-button>

</ion-content>
