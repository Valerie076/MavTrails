<ion-header>
  <ion-toolbar>
    <ion-title>
      Add New Trail
    </ion-title>

    <ion-button slot="end" (click)="closeModal()">
      Close
    </ion-button>

  </ion-toolbar>
</ion-header>


<ion-content>

  <ion-item>
    <ion-input label="Trail Name:" placeholder="Enter trail name" [(ngModel)]="name">
    </ion-input>
  </ion-item>


  <ion-item>
    <ion-input label="Location:" placeholder="Enter location" [(ngModel)]="location">
    </ion-input>
  </ion-item>


  <ion-item>
    <ion-textarea label="Add description:" placeholder="Describe the trail" [(ngModel)]="description">
    </ion-textarea>
  </ion-item>

  <ion-item>
    <ion-select label="Add Features:" placeholder="Select Features" multiple="true" [(ngModel)]="selectedValues">
      <ion-select-option value="hills">Hills</ion-select-option>
      <ion-select-option value="plains">Plains</ion-select-option>
      <ion-select-option value="wooded">Wooded</ion-select-option>
      <ion-select-option value="water">Water</ion-select-option>
      <ion-select-option value="houses">Houses</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-select label="Difficulty:" placeholder="Add Difficulty Rating" [(ngModel)]="difficulty">
      <ion-select-option value="very easy">Very Easy</ion-select-option>
      <ion-select-option value="easy">Easy</ion-select-option>
      <ion-select-option value="medium">Medium</ion-select-option>
      <ion-select-option value="hard">Hard</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-textarea label="Length:" placeholder="Add Trail Length" [(ngModel)]="length">
    </ion-textarea>
    (in miles)
  </ion-item>



  <ion-item>
    <ion-textarea label="Time:" placeholder="Add Expected Walk Time" [(ngModel)]="time">
    </ion-textarea>
    (in minutes)
  </ion-item>

  <!-- length, difficulty, time -->
  <ion-button expand="block" (click)="saveTrail()">
    Save Trail
  </ion-button>

</ion-content>
