<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Hello, {{user.username}}</ion-title>
    <ion-button slot="end" (click)="navigatePage('home')">Home</ion-button>
    <ion-button slot="end" (click)="navigateModal()">Update Profile</ion-button>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="false">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <ion-card>
      <strong>
        <ion-img
          src="https://png.pngtree.com/background/20250121/original/pngtree-elegant-green-flower-border-design-picture-image_16226054.jpg"></ion-img>
      </strong>
    </ion-card>
  </div>

  <div id="profilePic">
    <ion-card>
      <ion-img
        src="{{user.profilePicture}}"></ion-img>
    </ion-card>
  </div>

  <ion-grid style="height: 100%;">
    <ion-row class="ion-justify-content-center ion-align-items-center" style="height: 100%;">
      <ion-col size="8" size-md="6" size-lg="4">
        <ion-card>
          <ion-card-content>
            <strong>
              Username: {{user.username}}
              <br>
              Phone: {{user.phone}}
            </strong>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>


</ion-content>

<!-- NOTE: Once we get the firebase stuff and everything can be applied to each page we can do mustache notation -->
