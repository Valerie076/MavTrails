<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Main Map</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Main Map</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="map"></div>
  <ion-button (click)="createTrail()">Create Trail</ion-button>
  <ion-button (click)="endTrail()">Stop Creating Trail</ion-button>
  <ion-button (click)="saveTrail()">Save Trail</ion-button>

</ion-content>
