<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-menu-button slot="start"></ion-menu-button>
    <ion-title class="mavtrails">MavTrails</ion-title>

    <ion-button slot="end" (click)="navigatePage('profile')">Profile</ion-button>
    <ion-button slot="end" (click)="logout()" color="danger">Logout</ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Main Map</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="map"></div>

  @if(!creatingTrail) {
  <ion-button (click)="createTrail()">Create Trail</ion-button>
  }
  @if(creatingTrail) {
  <ion-button (click)="endTrail()">Complete Trail</ion-button>
  <ion-button (click)="undo()">Undo</ion-button>
  }
  <!-- <ion-button (click)="saveTrail()">Save Trail</ion-button> -->

</ion-content>
