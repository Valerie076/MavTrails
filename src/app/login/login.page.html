<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-input label="Email:" placeholder="enter email here" type="email" [(ngModel)]="emailIn"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input label="Password:" placeholder="enter password here" type="password" [(ngModel)]="passwordIn"></ion-input>
  </ion-item>

  <ion-grid>
    <ion-row>
    </ion-row>
    <ion-row class="ion-text-center">
      <!-- <ion-col>
      </ion-col> -->
      <ion-col>
        <ion-button size = large (click)="login()">Sign In</ion-button>
        <ion-row>
        </ion-row>
        <ion-button size = large (click)="presentRegister()">Register</ion-button>
      </ion-col>
      <!-- <ion-col>
      </ion-col> -->
    </ion-row>

  </ion-grid>

  <img
  src= "https://www.alltrails.com/mugen/image/trail-app-router?url=https%3A%2F%2Fwww.alltrails.com%2Fapi%2Falltrails%2Fv3%2Ftrails%2F10266044%2Fstatic_map%3Fkey%3D3p0t5s6b5g4g0e8k3c1j3w7y5c3m4t8i%26size%3D342x424%26scale%3D2%26show_3d%3Dyes&w=3840&q=75" width="500%">


</ion-content>
